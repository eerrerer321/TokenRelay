# AI 模型轉發站設定檔
#
# 用法：複製成 config.ini 再填值。config.ini 已列在 .gitignore，不會進 git。
# config.ini 會放上游的 API key：不要傳給別人、不要貼到聊天室、不要截圖。
#
# 格式：[區段] 底下寫「名稱 = 值」。# 開頭的整行是註解（同一行的值後面不能接註解）。
# 值留空 = 用預設值。名稱或區段打錯字，啟動時會直接報錯並指出是哪一行的哪個名稱。
# 請用 UTF-8 編碼存檔。改完要重啟伺服器才會生效。


# ================================================================ 網站

[site]
# 註冊用邀請碼，留空 = 關閉註冊（沒有人能註冊）
invite_code =

# 資料庫。預設是專案資料夾裡的 SQLite 檔案 dev.db。要改用 PostgreSQL，換成：
# database_url = postgresql+asyncpg://relay:你的密碼@localhost:5432/relay
database_url = sqlite+aiosqlite:///./dev.db

# ---- 以下都有預設值，通常不用改。要改就把 # 拿掉 ----
# 每個使用者同時進行中的請求數上限
# max_concurrent_per_user = 4
# 每個使用者最多幾把 API key
# max_keys_per_user = 20
# 單一請求內容上限（bytes），也間接限制了預扣金額
# max_body_bytes = 1000000
# 登入狀態維持幾小時
# session_ttl_hours = 168
# 等上游回應最多幾秒
# upstream_timeout_seconds = 300


# ================================================================ 上游
# 任何 OpenAI 相容的 API 都可以。[upstream:名稱] 的「名稱」自己取，下面的模型用這個名稱指定上游。
# 要接多家就複製整個區段，換個名稱。

[upstream:deepseek]
base_url = https://api.deepseek.com/v1
# 上游給你的 API key（不需要 key 的本機上游可以留空）
api_key =


# ================================================================ 對外開放的模型
# [model:名稱] 的「名稱」就是使用者在工具裡看到、選用的模型名稱。
# 沒列在這裡的模型一律拒絕。刪掉區段 = 下架。

[model:deepseek-chat]
# 用哪個上游（對應上面的 [upstream:名稱]）
upstream = deepseek
# 上游實際的模型名稱，留空 = 跟區段名稱一樣
upstream_model = deepseek-chat
# 你賣給朋友的價格：美元 / 100 萬 tokens，最多 6 位小數。
# 要比上游的進價高，不然每次請求站方都虧錢
input_price = 0.3
output_price = 1.2
# 單次回答最多幾個 token。預扣金額就是按這個算「最壞情況」
max_output_tokens = 8192
# 上游用哪個欄位限制輸出長度：大部分是 max_tokens；OpenAI 的新模型要改成 max_completion_tokens
max_tokens_field = max_tokens
# 一張圖片在這個模型「最多」算幾個 token（查上游文件的最壞情況），0 = 不接受圖片
image_tokens = 0


# ================================================================ 鏈上儲值
# rpc_url、receive_address、至少一個 [token:...] 都填了，才會啟用儲值。

[chain]
# 鏈的名稱，只是標籤：測試網和正式網用不同名稱，紀錄才不會混在一起
name = bsc-testnet
# 連區塊鏈的入口（RPC）。掃鏈要用 eth_getLogs 查轉帳紀錄，很多公開 RPC 不支援它。
# 2026-11-19 實測（測試網）：
#   可以用：https://bsc-prebsc-dataseed.bnbchain.org（官方）、https://bnb-testnet.api.onfinality.io/public
#   不能用：data-seed-prebsc-*、bsc-testnet-dataseed、bsc-testnet.bnbchain.org（eth_getLogs 回 limit exceeded）
# 正式網的官方公開 RPC 全都不支援 eth_getLogs，要去第三方服務（例如 NodeReal、Ankr、Chainstack）申請自己的 RPC 網址
rpc_url = https://bsc-prebsc-dataseed.bnbchain.org
# 你自己錢包的收款地址（0x 開頭）。USDT 和 USDC 都收到這同一個地址。
# 只要「地址」，絕對不要把私鑰或助記詞放進來
receive_address =
# 等幾個區塊確認才入帳（BSC 一個區塊不到 1 秒）
confirmations = 15
# 第一次啟動從哪個區塊開始掃，留空 = 從當下開始
# start_block =

# 收哪些代幣。測試網沒有官方的 USDT/USDC，下面是測試網上的測試代幣（2026-11-19 查過：合約存在、18 位小數）。
# 重點：這裡填的合約，必須跟你實際轉帳用的代幣是同一個，不然掃不到。
# 在 MetaMask 點代幣 → 代幣詳情，可以看到它的合約地址。
#
# 換成正式網時（使用前務必到 bscscan.com 核對）：
#   USDT  0x55d398326f99059fF775485246999027B3197955
#   USDC  0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d

[token:USDT]
contract = 0x337610d27c682E347C9cD60BD4b3b107C9d34dDd
decimals = 18

[token:USDC]
contract = 0x64544969ed7EBf5f083679233325356EbE738930
decimals = 18

[deposit]
# ---- 都有預設值，通常不用改 ----
# 訂單幾分鐘內要付款
# ttl_minutes = 30
# 過期後再多等幾分鐘才作廢（給晚到的轉帳）
# grace_minutes = 30
# 單筆儲值金額範圍（整數美元）
# min_usd = 1
# max_usd = 1000
# 每人最多幾張未付款訂單
# max_pending = 3
